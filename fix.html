<!-- A SHORT ADDRESS, BECAUSE THE LONG ONE PRODUCED A 404.

     /Condition-Monitoring/recover.html is the page; this is three letters
     of it. Somebody standing at a machine, on a phone, with gloves on,
     typing a forty-character path they were read over a radio, gets it
     wrong — and a 404 reads as "the fix does not exist" at exactly the
     moment they most need to believe it does. Same directory, same reason
     it works: one level ABOVE the app's worker scope, so a frozen build
     can never answer for it. -->
<meta http-equiv="refresh" content="0;url=recover.html">
