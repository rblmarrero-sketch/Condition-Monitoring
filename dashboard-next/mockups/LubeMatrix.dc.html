<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lubrication matrix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2ED;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1B1F23}
a{color:inherit;text-decoration:none}
a:hover{color:#1F5C7A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; min-height: 900px; box-sizing: border-box; display: flex; background: #F4F2ED">
<div style="width: 240px; flex-shrink: 0; background: #1B1F23">
<dc-import name="Nav" active="lube" lang="en" hint-size="240px,700px"></dc-import>
</div>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 16px 32px 40px; display: flex; flex-direction: column; gap: 20px">
<dc-import name="TopBar" lang="en" hint-size="100%,48px"></dc-import>
<dc-import name="Head" title="Fleet lubrication matrix" sub="Every model against every compartment" defs="Definitions" primary="Export CSV" secondary="" last-sync="" hint-size="100%,76px"></dc-import>
<dc-import name="DataTable" title="Fleet matrix" cols="{{mxCols}}" rows="{{mxRows}}"  hint-size="100%,320px"></dc-import>
<section style="background: #FBFAF7; border: 1px solid #DAD6CC; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Shop posters</h2>
<div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<dc-import name="Seg" label="Sheet" opts="{{sheets}}" active="0" hint-size="100%,72px"></dc-import>
<dc-import name="Seg" label="Fit" opts="{{fits}}" active="0" hint-size="100%,72px"></dc-import>
<button style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 0; background: #1F5C7A; font-size: 14px; font-weight: 500; color: #FFFFFF; cursor: pointer">Print</button>
</div>
<div style="font-size: 13px; color: #5A6169">A poster shows the lubricant, refill volume and interval for each compartment, sized to be read from a metre away.</div>
</section>
<div><a href="Lube.dc.html" style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C9C4B8; background: #FBFAF7; font-size: 14px; font-weight: 500; color: #1B1F23; cursor: pointer; display: inline-flex; align-items: center">Back to Lubrication</a></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const R = (...c) => ({ cells: c.map((x) => (typeof x === 'string' ? { t: x } : x)) });
    const id = (t) => ({ t, mono: true, ink: true });
    const mxCols = [{ label: 'Model' }, { label: 'Engine' }, { label: 'Transmission' }, { label: 'Final drive' }, { label: 'Hydraulic' }, { label: 'Coolant' }];
    const mxRows = [
      R(id('[Model A]'), '[Spec]', '[Spec]', '[Spec]', '[Spec]', '[Spec]'),
      R(id('[Model B]'), '[Spec]', '[Spec]', { t: 'Unsourced', chip: 'warn' }, '[Spec]', '[Spec]'),
      R(id('[Model C]'), '[Spec]', '[Spec]', '[Spec]', { t: 'Unsourced', chip: 'warn' }, '[Spec]')
    ];
    const sheets = [{ t: 'Whole fleet' }, { t: 'One model' }, { t: 'One asset class' }];
    const fits = [{ t: 'One page' }, { t: 'Actual size' }];
    return { mxCols, mxRows, sheets, fits };
  }
}
</script>
</body>
</html>
