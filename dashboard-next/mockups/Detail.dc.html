<style>
body{margin:0;background:#F4F2ED;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1B1F23}

</style>
</helmet>

<div style="font-size: 14px; color: #3D474F"><span style="color: #5A6169">Comment</span><br>[Comment]</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><a href="PhotoEditor.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #C9C4B8; background: #FBFAF7; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center">Edit photo</a><a href="AssignPhotos.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #C9C4B8; background: #FBFAF7; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center">Move to another position</a><a href="PhotoEditor.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #C9C4B8; background: #FBFAF7; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center">Exclude from report</a></div>
</div>
<div style="padding: 14px 24px; border-top: 1px solid #DAD6CC; display: flex; justify-content: flex-end; gap: 12px">
<button style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C9C4B8; background: #FBFAF7; font-size: 14px; font-weight: 500; color: #1B1F23; cursor: pointer">Report</button><button style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 0; background: #1F5C7A; font-size: 14px; font-weight: 500; color: #FFFFFF; cursor: pointer">Edit</button>
