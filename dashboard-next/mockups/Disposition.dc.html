<html lang="en">
<head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<div><h1 style="margin: 0; font-size: 20px; font-weight: 600">No action required</h1>
<div style="font-size: 14px; color: #5A6169; margin-top: 4px">Close this finding without a work order.</div></div>
<button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 22px; color: #5A6169; cursor: pointer">&times;</button>
</div>
<div style="padding: 8px 24px 20px; display: flex; flex-direction: column; gap: 14px">

<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5A6169">Reason<select style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9C4B8; border-radius: 6px; background: #FBFAF7; font: 14px 'IBM Plex Sans', sans-serif; color: #1B1F23; width: 100%"><option>Checked, no work needed</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5A6169">Approved by<input type="text" placeholder="[Name]" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9C4B8; border-radius: 6px; background: #FBFAF7; font: 14px 'IBM Plex Sans', sans-serif; color: #1B1F23; width: 260px" ></label>
<div style="font-size: 13px; color: #5A6169">The finding closes as Not needed and leaves the open actions list. The inspection itself is kept.</div>
</div>
<div style="padding: 14px 24px; border-top: 1px solid #DAD6CC; display: flex; justify-content: flex-end; gap: 12px">
<button style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C9C4B8; background: #FBFAF7; font-size: 14px; font-weight: 500; color: #1B1F23; cursor: pointer">Cancel</button><button style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 0; background: #1F5C7A; font-size: 14px; font-weight: 500; color: #FFFFFF; cursor: pointer">Save</button>
</div>
</div>
</div>
</x-dc>
