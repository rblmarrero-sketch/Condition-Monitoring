<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Defects raised</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2ED;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1B1F23}
a{color:inherit;text-decoration:none}
a:hover{color:#1F5C7A}
</style>
</helmet>
<div style="width: 1440px; min-height: 1040px; box-sizing: border-box; display: flex; background: #F4F2ED">
<div style="width: 240px; flex-shrink: 0; background: #1B1F23">
<dc-import name="Nav" active="defects" lang="en" hint-size="240px,700px"></dc-import>
</div>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 16px 32px 40px; display: flex; flex-direction: column; gap: 20px">
<dc-import name="TopBar" lang="en" hint-size="100%,48px"></dc-import>
<dc-import name="Head" title="Defects raised by Condition Monitoring" sub="Defect work orders from 1C's own export, one row per defect" defs="Definitions" primary="Export CSV" secondary="Refresh now" last-sync="Pulled from 1C [time]" hint-size="100%,76px"></dc-import>
<section style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px">
<dc-import name="Tile" label="Defects raised" tag="since [date]" value="00" note="work orders raised by the team" tone="#1F5C7A" ink="#1B1F23" hint-size="100%,150px"></dc-import>
<div style="background: #FBFAF7; border: 1px solid #DAD6CC; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600">By person</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="4"><button style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #C9C4B8; background: #FBFAF7; font-size: 14px; color: #1B1F23; cursor: pointer">{{p}}<span style="margin-left: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">00</span></button></sc-for>
</div>
<div style="font-size: 12px; color: #5A6169">Press a name to show only theirs.</div>
</div>
</section>
<div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<dc-import name="FilterBar" fields="{{filters}}" hint-size="200px,72px"></dc-import>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5A6169">Search
<input type="search" placeholder="unit, defect no, cause" style="height: 44px; width: 260px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9C4B8; border-radius: 6px; background: #FBFAF7; font: 14px 'IBM Plex Sans', sans-serif; color: #1B1F23"></label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px"><input type="checkbox" style="width: 22px; height: 22px">Show planned services too</label>
</div>
<dc-import name="DataTable" title="Defect work orders" cols="{{cols}}" rows="{{rows}}" hint-size="100%,380px"></dc-import>
<div style="font-size: 13px; color: #5A6169">1C repeats a work order per line item, so a defect with two parts booked against it is still one row here. Rows with no creation date in 1C are filed under the date the defect was detected, or the planned start of the repair.</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const R = (...c) => ({ cells: c.map((x) => (typeof x === 'string' ? { t: x } : x)) });
    const id = (t) => ({ t, mono: true, ink: true });
    const people = ['[Person A]', '[Person B]', '[Person C]', '[Person D]'];
    const filters = [{ label: 'Status', value: 'Any status' }];
    const cols = [{ label: 'Raised' }, { label: 'Asset' }, { label: 'Defect no' }, { label: 'System component' }, { label: 'Priority' }, { label: 'Defect type' }, { label: 'Description' }, { label: 'Cause' }, { label: 'Status' }, { label: 'Raised by' }];
    const rows = [
      R('[Date]', id('[Asset]'), id('[No.]'), '[Component]', '[Priority]', '[Type]', '[Description]', '[Cause]', { t: 'Open', chip: 'info' }, '[Name]'),
      R('[Date]', id('[Asset]'), id('[No.]'), '[Component]', '[Priority]', '[Type]', '[Description]', 'No cause in 1C', { t: 'Planned', chip: 'warn' }, '[Name]'),
      R('[Date]', id('[Asset]'), id('[No.]'), '[Component]', '[Priority]', '[Type]', '[Description]', '[Cause]', { t: 'Closed', chip: 'ok' }, '[Name]')
    ];
    return { people, filters, cols, rows };
  }
}
</script>
</body>
</html>
