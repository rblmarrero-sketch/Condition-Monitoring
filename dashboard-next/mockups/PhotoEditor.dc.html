<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HME Photo Editor — Industrial Standard</title>
<script src="/shared_photo_editor/hme-photo-editor.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0f1115;
    overflow: hidden;
  }
  hme-photo-editor {
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
  <hme-photo-editor id="editor"></hme-photo-editor>

  <script>
    const editor = document.getElementById('editor');

    // Sample initial asset pool to showcase FIR/RCA capabilities
    window.addEventListener('DOMContentLoaded', () => {
      editor.addPhoto({
        url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect fill="%23222" width="1200" height="900"/><circle cx="600" cy="450" r="280" fill="%233a3d45" stroke="%23555" stroke-width="12"/><text x="600" y="470" fill="%23888" font-size="32" text-anchor="middle" font-family="monospace">PRIMARY DRIVE GEAR</text></svg>',
        title: 'Drive Gear Overview',
        caption: 'Inspection of final drive assembly following vibration alarm',
        selected: true
      });

      editor.addPhoto({
        url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect fill="%231a1a1a" width="1200" height="900"/><path d="M 300 600 Q 600 200 900 600" stroke="%23ff5500" stroke-width="16" fill="none"/><text x="600" y="300" fill="%23ffaa00" font-size="28" text-anchor="middle" font-family="monospace">CLOSE-UP: FLANK CRACK</text></svg>',
        title: 'Tooth #14 Root Crack',
        caption: 'Close-up macro detail of crack initiation site at tooth root fillet',
        selected: true
      });

      editor.addEventListener('save', (e) => {
        console.log('Saved flattened image and metadata recipe:', e.detail);
        alert('Photo saved successfully! Recipe schema: ' + e.detail.metadata.schema);
      });

      editor.addEventListener('cancel', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.close();
        }
      });
    });
  </script>
</body>
</html>
