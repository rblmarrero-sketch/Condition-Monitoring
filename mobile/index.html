<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Truck Inspection — Capture</title>
<link rel="manifest" href="manifest.webmanifest">
<!--
  Truck Inspection — mobile CAPTURE app (offline-first) for NHL TR60 dump trucks.
  Three types via the dropdown: Magnetic Plug (MP) · Filter Cut (FC) · Inspection (INSP).
  Files: <EQUIP>_<ITEM>_<DD.MM.YYYY>_<TYPE>.jpg  e.g. TK146_4C_30.07.2026_MP.jpg,
                                                       TK146_ENG_30.07.2026_INSP.jpg
  Edit the TYPES config below to change components/filters/positions.
-->
<style>
  :root{ color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --surface-3:#2f2f2c;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#8b8a83; --border:rgba(255,255,255,.12);
    --accent:#3987e5; --accent-ink:#fff;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --none:#6b6a65; }
  @media (prefers-color-scheme: light){ :root:where(:not([data-theme="dark"])){ color-scheme:light;
    --page:#f4f4f1; --surface:#fff; --surface-2:#f2f2ef; --surface-3:#e9e9e4;
    --ink:#111; --ink-2:#44433f; --muted:#8b8a83; --border:rgba(0,0,0,.12); } }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;padding-bottom:120px;}
  header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;}
  header .t{font-weight:700;font-size:16px;}
  .lang{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-left:6px;}
  .lang button{border:none;background:var(--surface-2);color:var(--ink-2);padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;}
  .lang button.on{background:var(--accent);color:#fff;}
  header .st{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);}
  header .st.off{color:var(--warning);} header .st.on{color:var(--good);}
  main{padding:16px;max-width:640px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  label.fld{display:block;margin-bottom:12px;}
  label.fld > span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px;}
  input,select,textarea{width:100%;min-width:0;max-width:100%;background:var(--surface-2);color:var(--ink);border:1px solid var(--border);
    border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none;}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  textarea{resize:vertical;min-height:52px;}
  .row{display:flex;gap:12px;} .row > *{flex:1 1 0;min-width:0;}
  .withbtn{display:flex;gap:8px;align-items:stretch;}
  .withbtn > input, .withbtn > textarea{flex:1;}
  .iconbtn{flex:none;white-space:nowrap;background:var(--surface-3);color:var(--ink);border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:15px;font-weight:650;cursor:pointer;}
  .withbtn > textarea + .iconbtn{align-self:flex-start;padding:12px;font-size:18px;}
  .iconbtn.rec{background:var(--critical);color:#fff;border-color:transparent;animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.55;}}
  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:56px;padding:12px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);font-size:15px;font-weight:650;cursor:pointer;}
  .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .posnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .posnav button{flex:1 1 auto;min-width:56px;padding:11px 10px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:14px;cursor:pointer;position:relative;}
  .posnav button.on{background:var(--ink);color:var(--page);border-color:transparent;}
  .posnav-pick{flex:1 1 100%;padding:11px;border-radius:12px;border:1px solid var(--accent);background:var(--surface-2);color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:2px;}
  /* component cascade (L7 cards -> L8 -> L9) */
  .casc{margin-bottom:14px;}
  .crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .crumb button{background:none;border:none;color:var(--accent);font-weight:650;font-size:12.5px;cursor:pointer;padding:2px 0;}
  .crumb .sep{color:var(--muted);}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .cards button{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 12px;cursor:pointer;position:relative;}
  .cards button .cc{font-size:11px;color:var(--muted);font-weight:700;}
  .cards button .cn{font-size:14px;color:var(--ink);font-weight:600;line-height:1.2;}
  .cards button .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--good);display:none;}
  .cards button.has .dot{display:block;}
  .cards button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
  .clist button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:7px;cursor:pointer;color:var(--ink);font-size:14px;}
  .clist button .r{color:var(--muted);font-size:13px;}
  .clist button.has{border-color:var(--good);}
  .searchall{width:100%;padding:9px;border:1px dashed var(--border);background:none;color:var(--accent);border-radius:10px;font-size:13px;font-weight:650;cursor:pointer;margin-bottom:10px;}
  .prompt-pick{color:var(--muted);font-size:13px;text-align:center;padding:14px;}
  .posnav button .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--good);display:none;}
  .posnav button.has .dot{display:block;}
  .shot{width:100%;aspect-ratio:4/3;border-radius:14px;border:2px dashed var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;overflow:hidden;margin-bottom:12px;position:relative;text-align:center;padding:10px;}
  .shot img{width:100%;height:100%;object-fit:cover;}
  .shot .retake{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:13px;}
  .gradeseg button.g-A.on{background:var(--good);} .gradeseg button.g-B.on{background:var(--warning);color:#111;}
  .gradeseg button.g-C.on{background:var(--serious);} .gradeseg button.g-D.on{background:var(--critical);} .gradeseg button.g-X.on{background:var(--none);}
  .btn{display:block;width:100%;padding:16px;border-radius:14px;border:none;font-size:17px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
  .pending{display:flex;flex-direction:column;gap:10px;}
  .pitem{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;}
  .pitem .thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--surface-3);flex:none;}
  .pitem .meta{flex:1;min-width:0;} .pitem .meta .a{font-weight:700;} .pitem .meta .b{font-size:12.5px;color:var(--muted);}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--accent);color:#fff;margin-right:6px;vertical-align:middle;}
  .pitem .edit{background:none;border:none;color:var(--accent);font-size:19px;padding:6px;cursor:pointer;}
  .pitem .del{background:none;border:none;color:var(--critical);font-size:20px;padding:6px;cursor:pointer;}
  .empty{color:var(--muted);text-align:center;padding:20px;font-size:14px;}
  .bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px;z-index:10;}
  .bottombar .btn{margin:0;}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .ver{text-align:center;color:var(--muted);font-size:11px;margin:2px 0 8px;}
  .editbar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--border));border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13.5px;}
  .editbar span{flex:1;color:var(--ink);} .linkbtn{background:none;border:none;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;}
  .hidden{display:none!important;}
  .count-badge{background:var(--accent);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px;}
  dialog{border:none;border-radius:16px;background:var(--surface);color:var(--ink);max-width:92vw;width:420px;padding:0;}
  dialog::backdrop{background:rgba(0,0,0,.6);}
  .dlg-in{padding:20px;} .dlg-in h3{margin:0 0 8px;} .dlg-in p{color:var(--ink-2);font-size:14px;}
  .scan-ov{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scan-ov video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .scan-frame{position:relative;width:66vw;max-width:280px;aspect-ratio:1;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);}
  .scan-hint{position:absolute;bottom:120px;color:#fff;font-size:15px;background:rgba(0,0,0,.5);padding:8px 14px;border-radius:10px;text-align:center;}
  .scan-ov .btn{position:absolute;bottom:40px;width:200px;}
  /* media strip (multi-photo + video) */
  .mediastrip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .mtile{position:relative;width:calc(25% - 6px);aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);}
  .mtile img,.mtile video{width:100%;height:100%;object-fit:cover;display:block;}
  .mtile .mdel{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;line-height:22px;padding:0;}
  .mtile .vbadge{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center;padding:1px;}
  .mediastrip .empty-m{color:var(--muted);font-size:13px;padding:14px 2px;}
  .mediahint{margin:0 0 12px;}
  .picker-btn{width:100%;text-align:left;background:var(--surface-2);color:var(--ink);border:1px solid var(--border);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;cursor:pointer;}
  .picker-btn:disabled{color:var(--muted);}
  .pick-ov{position:fixed;inset:0;background:var(--page);z-index:210;display:flex;flex-direction:column;}
  .pickhead{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;background:var(--surface);border-bottom:1px solid var(--border);}
  .pickhead input{flex:1;}
  .pickback{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--accent);font-size:26px;line-height:1;cursor:pointer;}
  .picklist{flex:1;overflow-y:auto;padding:8px 14px calc(env(safe-area-inset-bottom) + 20px);}
  .pickitem{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--border);color:var(--ink);padding:13px 4px;font-size:15px;cursor:pointer;}
  .pickitem .pickgrp{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:2px;}
  .pickitem:active{background:var(--surface-2);}
</style>
</head>
<body>
<header>
  <span class="t" data-i18n="app_title">Truck Inspection</span>
  <span class="lang"><button data-lang="en" class="on">EN</button><button data-lang="ru">RU</button></span>
  <span class="st" id="netStatus">…</span>
</header>

<main>
  <div class="card">
    <h2 data-i18n="sec_inspection">Inspection</h2>
    <div class="row">
      <label class="fld"><span data-i18n="lbl_class">Equipment</span><select id="classSel"></select></label>
      <label class="fld"><span data-i18n="lbl_type">Inspection type</span><select id="typeSel"></select></label>
    </div>
    <label class="fld"><span data-i18n="lbl_truck">Truck / Unit</span>
      <div class="withbtn">
        <button type="button" class="picker-btn" id="equipBtn"></button>
        <button type="button" class="iconbtn" id="scanBtn">🔳 <span data-i18n="btn_scan">Scan</span></button>
      </div>
    </label>
    <input id="qrPhoto" type="file" accept="image/*" capture="environment" class="hidden">
    <div class="row">
      <label class="fld"><span data-i18n="lbl_date">Date</span><input id="date" type="date"></label>
      <label class="fld"><span data-i18n="lbl_smu">SMU / machine hrs</span><input id="smu" type="number" inputmode="numeric" data-i18n-ph="ph_smu" placeholder="e.g. 6018"></label>
    </div>
  </div>

  <div class="card">
    <h2 id="secPosTitle">Component</h2>
    <div class="posnav" id="posnav"></div>
    <div class="posLabel hint" id="posLabel"></div>

    <div id="captureBox">
    <div class="mediastrip" id="mediastrip"></div>
    <div class="mediahint hint" id="mediaHint"></div>
    <input id="camera" type="file" accept="image/*" capture="environment" class="hidden">
    <input id="video" type="file" accept="video/*" capture="environment" class="hidden">
    <div class="row" style="margin-bottom:14px">
      <button class="btn primary" id="takeBtn" type="button">📷 <span data-i18n="btn_take">Add photo</span></button>
      <button class="btn ghost" id="videoBtn" type="button">🎥 <span data-i18n="btn_video">Video</span></button>
    </div>

    <label class="fld"><span data-i18n="lbl_grade">Grade / condition</span>
      <div class="seg gradeseg" id="gradeSeg">
        <button class="g-A" data-g="A">A</button><button class="g-B" data-g="B">B</button>
        <button class="g-C" data-g="C">C</button><button class="g-D" data-g="D">D</button><button class="g-X" data-g="X">X</button>
      </div>
    </label>
    <div id="mpFields">
      <div class="row">
        <label class="fld"><span data-i18n="lbl_particle">Particle count</span><input id="particle" type="text" inputmode="numeric"></label>
        <label class="fld"><span data-i18n="lbl_comp">Component hrs</span><input id="comp" type="number" inputmode="numeric"></label>
      </div>
      <label class="fld"><span data-i18n="lbl_oil">Oil hrs</span><input id="oil" type="number" inputmode="numeric"></label>
    </div>
    <label class="fld"><span data-i18n="lbl_defect">Defect / failure mode</span>
      <button type="button" class="picker-btn" id="defectBtn"></button>
    </label>
    <label class="fld"><span data-i18n="lbl_cause">Direct cause</span>
      <button type="button" class="picker-btn" id="causeBtn"></button>
    </label>
    <label class="fld"><span data-i18n="lbl_comment">Comment</span>
      <div class="withbtn">
        <textarea id="comment" rows="2" data-i18n-ph="ph_comment" placeholder="notes…"></textarea>
        <button type="button" class="iconbtn" id="micBtn" title="Dictate">🎤</button>
      </div>
    </label>
    <div class="hint" data-i18n="hint_fields">Fields save automatically. Switch items with the buttons above.</div>
    </div><!-- /captureBox -->
  </div>

  <div id="editBanner" class="editbar hidden"><span id="editBannerText"></span><button type="button" id="cancelEdit" class="linkbtn"></button></div>
  <button class="btn primary" id="saveBtn" style="margin-bottom:16px">✔ Save</button>

  <div class="card">
    <h2><span data-i18n="sec_onphone">On this phone</span> <span class="count-badge" id="qCount">0</span></h2>
    <div class="pending" id="pending"></div>
  </div>

  <button class="btn ghost" id="reportBtn" style="margin-bottom:16px">📄 <span data-i18n="btn_report">PDF report</span></button>

  <div class="ver">build v19 · 2026-07-31 · Card hierarchy · <a href="#" id="forceUpdate" style="color:var(--accent);font-weight:700;">⟳ Update</a></div>
</main>

<div class="bottombar">
  <button class="btn ghost" id="shareBtn">📤 <span data-i18n="btn_share">Share</span></button>
  <button class="btn primary" id="exportBtn">⬇ <span data-i18n="btn_export">Export ZIP</span></button>
</div>

<div id="scanOverlay" class="scan-ov hidden">
  <video id="scanVideo" playsinline muted></video><div class="scan-frame"></div>
  <div class="scan-hint" data-i18n="scan_hint">Point at the unit's QR code</div>
  <button class="btn ghost" id="scanCancel" data-i18n="btn_cancel">Cancel</button>
</div>
<canvas id="qrCanvas" class="hidden"></canvas>

<dialog id="dlg"><div class="dlg-in"><h3 id="dlgTitle"></h3><p id="dlgMsg"></p>
  <button class="btn primary" id="dlgOk" style="margin-top:14px" data-i18n="dlg_ok">OK</button></div></dialog>

<div id="pickOv" class="pick-ov hidden">
  <div class="pickhead">
    <button id="pickCancel" class="pickback" aria-label="Back">‹</button>
    <input id="pickSearch" type="search" autocomplete="off">
  </div>
  <div id="pickList" class="picklist"></div>
</div>

<script src="jsQR.js"></script>
<script src="taxonomy.js"></script>
<script src="assets.js"></script>
<script src="components.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="html2canvas.min.js"></script>
<script>
/* ============================================================================
   EQUIPMENT CLASSES & INSPECTION TYPES  —  EDIT here for your fleet.
   • TYPE_META: the 3 inspection kinds (Magnetic Plug / Filter Cut / Inspection).
   • COMP: reusable component dictionary (code -> EN/RU label) for INSP walk-arounds.
   • CLASSES: per machine class, the MP plug positions, FC filters, and INSP list.
   Item code (k) goes into the file name, e.g. EX07_TL_30.07.2026_MP.jpg.
   ========================================================================== */
const TYPE_META = {
  MP:   { suffix:"MP",   showReadings:true,  title:{en:"Plug position",     ru:"Позиция пробки"} },
  FC:   { suffix:"FC",   showReadings:true,  title:{en:"Filter",           ru:"Фильтр"} },
  INSP: { suffix:"INSP", showReadings:false, title:{en:"Component / System",ru:"Узел / Система"} },
};
const TYPE_ORDER = ["MP","FC","INSP"];

const COMP = {
  ENG:{en:"Engine",ru:"Двигатель"}, COOL:{en:"Cooling System",ru:"Система охлаждения"},
  AIR:{en:"Air Intake & Exhaust",ru:"Впуск и выпуск"}, FUEL:{en:"Fuel System",ru:"Топливная система"},
  TRANS:{en:"Transmission",ru:"Трансмиссия"}, TCONV:{en:"Torque Converter",ru:"Гидротрансформатор"},
  DRV:{en:"Driveline",ru:"Карданная передача"}, DIFF:{en:"Differential",ru:"Дифференциал"},
  FDR:{en:"Final Drives",ru:"Бортовые редукторы"}, HYD:{en:"Hydraulic System",ru:"Гидросистема"},
  HOIST:{en:"Hoist & Body",ru:"Подъём и кузов"}, STEER:{en:"Steering",ru:"Рулевое управление"},
  BRK:{en:"Brakes & Retarder",ru:"Тормоза и ретардер"}, SUSP:{en:"Suspension",ru:"Подвеска"},
  FRAME:{en:"Frame & Chassis",ru:"Рама и шасси"}, TYRE:{en:"Tyres & Rims",ru:"Шины и диски"},
  ELEC:{en:"Electrical",ru:"Электрооборудование"}, CAB:{en:"Cab & Controls",ru:"Кабина и управление"},
  LUBE:{en:"Auto-Lube",ru:"Система смазки"}, FIRE:{en:"Fire & Safety",ru:"Пожаробезопасность"},
  ETRAC:{en:"Electric Drive / Traction",ru:"Электропривод / тяга"}, WHEELM:{en:"Wheel Motors",ru:"Мотор-колёса"},
  SWING:{en:"Swing System",ru:"Механизм поворота"}, SWGB:{en:"Swing Gearbox",ru:"Редуктор поворота"},
  TRAVEL:{en:"Travel / Track Drive",ru:"Ходовой привод"}, UC:{en:"Undercarriage",ru:"Ходовая часть"},
  TRACK:{en:"Tracks & Tension",ru:"Гусеницы и натяжение"}, BOOM:{en:"Boom",ru:"Стрела"},
  STICK:{en:"Stick / Arm",ru:"Рукоять"}, BKT:{en:"Bucket & GET",ru:"Ковш и зубья"},

/* ===================== defect + direct-cause taxonomy (from taxonomy.js) ===================== */
const TAX = window.TAX || {defects:[],causes:[],defectGroups:[],defectGroupRu:{},causeGroupRu:{}};
const DEFECT_BY = {}; TAX.defects.forEach(d=>DEFECT_BY[d.c]=d);
const CAUSE_BY  = {}; TAX.causes.forEach(c=>CAUSE_BY[c.c]=c);
function defectLabel(code,l){ const d=DEFECT_BY[code]; return d?(d[l||lang]||d.en):code; }
function causeLabel(code,l){ const c=CAUSE_BY[code]; return c?(c[l||lang]||c.en):code; }
// direct causes that apply to a defect for the current equipment's asset range
function causesFor(defectCode){
  if(!defectCode) return [];
  const asset=(CLASSES[eqClass]||{}).asset||"";
  let list=TAX.causes.filter(c=>c.dt&&c.dt.indexOf(defectCode)>=0 &&
    (!asset || (c.as&&(c.as.indexOf(asset)>=0||c.as.indexOf("ALL PRIMARY HME")>=0))));
  if(asset && !list.length) list=TAX.causes.filter(c=>c.dt&&c.dt.indexOf(defectCode)>=0); // fallback: ignore asset
  return list;
}

function currentTree(){ return (type==="INSP" && curEquip && UNIT_TPL[curEquip]!=null) ? COMP_TREE[UNIT_TPL[curEquip]] : null; }
function flattenTree(nodes,out){ out=out||[]; for(const n of nodes){ if(String(n.k).indexOf(".")>=0) out.push({k:n.k,en:n.en,ru:n.ru}); if(n.ch) flattenTree(n.ch,out); } return out; }
function nodeByCode(tree,code){ let f=null; (function rec(ns){ for(const n of ns){ if(n.k===code){f=n;return;} if(n.ch)rec(n.ch);} })(tree); return f; }
function hasUnder(node){ if(!node) return false; if(draft.positions[node.k]) return true; return node.ch? node.ch.some(hasUnder):false; }
function items(){ const tr=currentTree(); if(tr) return flattenTree(tr);
  return CLASSES[eqClass][type].map(e=> typeof e==="string" ? {k:e, en:COMP[e].en, ru:COMP[e].ru} : e); }
function itemLabel(k){ const it=items().find(i=>i.k===k); return it?(it[lang]||it.en):k; }
let draft={positions:{}}; let curItem=items()[0].k;
function curP(){ return (draft.positions[curItem] ||= {}); }

/* ===================== IndexedDB ===================== */
const DB_NAME="plug_capture", STORE="inspections";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE,{keyPath:"id"}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function dbPut(rec){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction(STORE,"readwrite"); t.objectStore(STORE).put(rec); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function dbAll(){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction(STORE,"readonly"); const rq=t.objectStore(STORE).getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); }); }
async function dbDel(id){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction(STORE,"readwrite"); t.objectStore(STORE).delete(id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }

/* ===================== class + type + component chips ===================== */
function fillClassSel(){ $("classSel").innerHTML=CLASS_ORDER.map(k=>`<option value="${k}">${CLASSES[k][lang]||CLASSES[k].en}</option>`).join(""); $("classSel").value=eqClass; }
function fillTypeSel(){ $("typeSel").innerHTML=TYPE_ORDER.map(k=>`<option value="${k}">${t("type_"+k)}</option>`).join(""); $("typeSel").value=type; }
$("classSel").onchange=(e)=>{ eqClass=e.target.value; localStorage.setItem("equip_class",eqClass);
  draft={positions:{}}; editing=null; curItem=""; applyForm(); setEditing(null); };
$("typeSel").onchange=(e)=>{ type=e.target.value; localStorage.setItem("insp_type",type);
  draft={positions:{}}; editing=null; curItem=""; applyForm(); setEditing(null); };
function renderChips(){ const tr=currentTree();
  if(tr){ renderComponentNav(tr); return; }         // registered unit -> L7/L8/L9 cascade cards
  const its=items();
  if(type==="INSP"){ renderFlatCards(its); return; } // Inspection (no unit tree) -> flat cards
  // Magnetic Plug / Filter Cut -> compact chip row (few items)
  $("posnav").innerHTML=its.map(it=>`<button data-pos="${it.k}"><span>${it.k}</span><span class="dot"></span></button>`).join("");
  toggleCapture(); refreshChips(); }
function renderFlatCards(its){
  let h='<div class="casc"><button class="searchall" id="searchAllBtn">🔍 '+t("opt_search_all")+'</button>';
  h+='<div class="cards">'+its.map(it=>`<button data-pick="${it.k}" class="${draft.positions[it.k]?'has':''}${it.k===curItem?' on':''}"><span class="cc">${it.k}</span><span class="cn">${it[lang]||it.en}</span><span class="dot"></span></button>`).join('')+'</div></div>';
  $("posnav").innerHTML=h;
  const sa=$("searchAllBtn"); if(sa) sa.onclick=()=>openPicker("item");
  $("posnav").querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pickComponent(b.dataset.pick));
  toggleCapture(); }
function toggleCapture(){ const tr=currentTree(); const show=!tr||!!curItem;
  $("captureBox").style.display=show?"":"none"; }
function pickComponent(code){ saveCur(); curItem=code; loadPos(); renderChips(); }
function renderComponentNav(tree){
  const cap=items().filter(it=>draft.positions[it.k]);
  let h='<div class="casc"><div class="crumb"><button data-nav="root">'+t("nav_systems")+'</button>';
  if(cascL7){ const n=nodeByCode(tree,cascL7); h+='<span class="sep">›</span><button data-nav="l7">'+(n?(n[lang]||n.en):cascL7)+'</button>'; }
  if(cascL8){ const n=nodeByCode(tree,cascL8); h+='<span class="sep">›</span><button data-nav="l8">'+(n?(n[lang]||n.en):cascL8)+'</button>'; }
  h+='</div>';
  h+='<button class="searchall" id="searchAllBtn">🔍 '+t("opt_search_all")+'</button>';
  if(!cascL7){
    h+='<div class="cards">'+tree.map(n=>`<button data-l7="${n.k}" class="${hasUnder(n)?'has':''}"><span class="cc">${n.k}</span><span class="cn">${n[lang]||n.en}</span><span class="dot"></span></button>`).join('')+'</div>';
  } else if(!cascL8){
    const n7=nodeByCode(tree,cascL7); const kids=(n7&&n7.ch)||[];
    h+='<div class="cards">'+kids.map(n=>{ const hk=n.ch&&n.ch.length;
      return `<button data-l8="${n.k}" class="${(draft.positions[n.k]||hasUnder(n))?'has':''}"><span class="cc">${String(n.k).split('.').pop()}${hk?' ›':''}</span><span class="cn">${n[lang]||n.en}</span><span class="dot"></span></button>`; }).join('')+'</div>';
  } else {
    const n8=nodeByCode(tree,cascL8); const kids=(n8&&n8.ch)||[];
    h+='<div class="cards"><button data-pick="'+n8.k+'" class="'+(draft.positions[n8.k]?'has':'')+'"><span class="cc">▶</span><span class="cn">'+t("nav_whole")+'</span><span class="dot"></span></button>';
    h+=kids.map(n=>`<button data-pick="${n.k}" class="${draft.positions[n.k]?'has':''}"><span class="cc">${String(n.k).split('.').pop()}</span><span class="cn">${n[lang]||n.en}</span><span class="dot"></span></button>`).join('')+'</div>';
  }
  if(cap.length) h+='<div class="posnav" style="margin-top:6px">'+cap.map(it=>`<button data-pos="${it.k}" title="${itemLabel(it.k)}"><span>${String(it.k).split('.').pop()}</span><span class="dot"></span></button>`).join('')+'</div>';
  h+='</div>';
  $("posnav").innerHTML=h;
  $("posnav").querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ if(b.dataset.nav==='root'){cascL7=null;cascL8=null;} else if(b.dataset.nav==='l7'){cascL8=null;} renderChips(); });
  const sa=$("searchAllBtn"); if(sa) sa.onclick=()=>openPicker("item");
  $("posnav").querySelectorAll('[data-l7]').forEach(b=>b.onclick=()=>{cascL7=b.dataset.l7;cascL8=null;renderChips();});
  $("posnav").querySelectorAll('[data-l8]').forEach(b=>b.onclick=()=>{ const n=nodeByCode(tree,b.dataset.l8); if(n&&n.ch&&n.ch.length){cascL8=b.dataset.l8;renderChips();} else pickComponent(b.dataset.l8); });
  $("posnav").querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pickComponent(b.dataset.pick));
  $("posnav").querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>pickComponent(b.dataset.pos));
  toggleCapture(); refreshChips(); }
function refreshChips(){ $("posnav").querySelectorAll("button").forEach(b=>{
  b.classList.toggle("on", b.dataset.pos===curItem); b.classList.toggle("has", !!draft.positions[b.dataset.pos]); }); }
$("posnav").addEventListener("click",(e)=>{ const b=e.target.closest("button[data-pos]"); if(!b) return;
  saveCur(); curItem=b.dataset.pos; refreshChips(); loadPos(); });
function applyForm(){ $("secPosTitle").textContent=TYPE_META[type].title[lang]||TYPE_META[type].title.en;
  $("mpFields").classList.toggle("hidden", !TYPE_META[type].showReadings);
  cascL7=null; cascL8=null;
  const tr=currentTree(); const flat=items();
  if(tr){ if(curItem && !flat.some(i=>i.k===curItem)) curItem=""; }
  else { if(!curItem || !flat.some(i=>i.k===curItem)) curItem=(flat[0]||{k:""}).k; }
  fillClassSel(); fillTypeSel(); renderChips(); loadPos(); }

/* ===================== media: up to 4 photos + 1 video (<=60s) ===================== */
const MAX_PHOTOS=4, MAX_VIDEO_SEC=60;
$("takeBtn").onclick=()=>{ if((curP().photos||[]).length>=MAX_PHOTOS){ return; } $("camera").click(); };
$("videoBtn").onclick=()=>$("video").click();
$("camera").onchange=(e)=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const p=curP(); (p.photos ||= []); if(p.photos.length<MAX_PHOTOS) p.photos.push(f); renderMedia(); renderChips(); };
$("video").onchange=(e)=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const v=document.createElement("video"); v.preload="metadata";
  v.onloadedmetadata=()=>{ if(v.duration && v.duration>MAX_VIDEO_SEC+0.8){ dlg(t("video_too_long")); }
    else { curP().video=f; renderMedia(); renderChips(); } URL.revokeObjectURL(v.src); };
  v.onerror=()=>{ curP().video=f; renderMedia(); renderChips(); };  // if metadata fails, accept
  v.src=URL.createObjectURL(f); };
function renderMedia(){ const p=draft.positions[curItem]||{}; const ph=p.photos||[]; let h="";
  ph.forEach((b,i)=>{ h+=`<div class="mtile"><img src="${URL.createObjectURL(b)}"><button class="mdel" data-ph="${i}">✕</button></div>`; });
  if(p.video) h+=`<div class="mtile"><video src="${URL.createObjectURL(p.video)}" muted playsinline></video><span class="vbadge">▶ video</span><button class="mdel" data-vid="1">✕</button></div>`;
  if(!ph.length && !p.video) h=`<div class="empty-m">${t("media_empty")}</div>`;
  $("mediastrip").innerHTML=h;
  $("mediaHint").textContent=t("media_hint");
  $("takeBtn").disabled = ph.length>=MAX_PHOTOS;
  $("videoBtn").disabled = !!p.video;
  $("mediastrip").querySelectorAll(".mdel").forEach(btn=>btn.onclick=()=>{ const p=curP();
    if(btn.dataset.ph!==undefined){ p.photos.splice(+btn.dataset.ph,1); if(!p.photos.length) delete p.photos; }
    else { delete p.video; } renderMedia(); renderChips(); }); }

function renderGrade(){ const g=curP().grade; $("gradeSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.g===g)); }
["particle","comp","oil","comment"].forEach(id=>$(id).addEventListener("input",()=>{ saveCur(); refreshChips(); }));
function hasData(p){ return p.grade||(p.photos&&p.photos.length)||p.video||p.particle||p.comp||p.oil||p.comment||p.defect||p.cause; }
function saveCur(){ if(!curItem) return; const p=curP(); p.particle=$("particle").value.trim(); p.comp=$("comp").value.trim(); p.oil=$("oil").value.trim();

  $("equipBtn").textContent = curEquip ? (a&&a.cat? `${curEquip} · ${a.cat}` : curEquip) : t("opt_pick_unit"); }

let pickMode=null;

function renderPickList(q){ q=(q||"").trim(); const ql=q.toLowerCase();

function openPicker(mode){ pickMode=mode; $("pickSearch").value=""; $("pickSearch").placeholder=t("pick_search"); renderPickList(""); $("pickOv").classList.remove("hidden"); setTimeout(()=>$("pickSearch").focus(),50); }
function closePicker(){ $("pickOv").classList.add("hidden"); }
function updateDefectCauseBtns(){ const p=draft.positions[curItem]||{};
  $("defectBtn").textContent = p.defect ? defectLabel(p.defect) : t("opt_none");
  $("causeBtn").disabled = !p.defect;
  $("causeBtn").textContent = p.cause ? causeLabel(p.cause) : (p.defect ? t("opt_cause_tbd") : t("opt_cause_pick")); }
$("equipBtn").onclick=()=>openPicker("equip");
$("defectBtn").onclick=()=>openPicker("defect");
$("causeBtn").onclick=()=>{ if((draft.positions[curItem]||{}).defect) openPicker("cause"); };
$("pickSearch").oninput=(e)=>renderPickList(e.target.value);
$("pickCancel").onclick=closePicker;
$("pickList").onclick=(e)=>{ const b=e.target.closest(".pickitem"); if(!b) return; const k=b.dataset.k;
  if(pickMode==="equip"){ selectEquip(k==="__custom__" ? $("pickSearch").value : k); closePicker(); return; }
  if(pickMode==="item"){ saveCur(); curItem=k; closePicker(); renderChips(); loadPos(); return; }
  const p=curP();
  if(pickMode==="defect"){ p.defect=k||""; if(!causesFor(p.defect).some(c=>c.c===p.cause)) p.cause=""; }
  else { p.cause=k||""; }
  if(!hasData(p)) delete draft.positions[curItem];
  closePicker(); updateDefectCauseBtns(); refreshChips(); };

/* ===================== date + edit ===================== */
function todayISO(){ const d=new Date(),p=(n)=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
$("date").value=todayISO();
function updateSaveLabel(){ $("saveBtn").textContent = editing ? t("btn_update") : t("btn_save"); }
function setEditing(rec){ editing=rec||null;
  if(editing){ $("editBanner").classList.remove("hidden"); $("editBannerText").textContent=t("editing_hint").replace("{x}",editing.equip); }
  else $("editBanner").classList.add("hidden");
  $("cancelEdit").textContent=t("btn_cancel"); updateSaveLabel(); }
function resetForm(){ draft={positions:{}}; curEquip=""; curItem=""; updateEquipBtn(); $("smu").value=""; $("date").value=todayISO();
  applyForm(); setEditing(null); }
function editRecord(rec){ if(rec.cls && CLASSES[rec.cls]){ eqClass=rec.cls; localStorage.setItem("equip_class",eqClass); }
  if(rec.type && TYPE_META[rec.type]){ type=rec.type; localStorage.setItem("insp_type",type); }
  draft={positions:{}};
  for(const [k,pp] of Object.entries(rec.positions)) draft.positions[k]={grade:pp.grade,particle:pp.particle,comp:pp.comp,oil:pp.oil,comment:pp.comment,defect:pp.defect,cause:pp.cause,photos:(pp.photos?pp.photos.slice():(pp.photoBlob?[pp.photoBlob]:[])),video:pp.video||null};
  curEquip=rec.equip||""; updateEquipBtn(); $("date").value=rec.date; $("smu").value=rec.smu||"";
  curItem=Object.keys(draft.positions)[0]||items()[0].k;
  applyForm(); loadPos(); setEditing(rec); window.scrollTo({top:0,behavior:"smooth"}); }
$("cancelEdit").onclick=()=>resetForm();

/* ===================== save to queue ===================== */
$("saveBtn").onclick=async ()=>{
  saveCur();
  const equip=(curEquip||"").trim().toUpperCase().replace(/\s+/g,""); const date=$("date").value;
  if(!equip){ dlg(t("m_need_truck")); return; }
  if(!Object.keys(draft.positions).length){ dlg(t("m_nothing_save")); return; }
  const id = editing ? editing.id : `${type}__${equip}__${date}__${Date.now()}`;
  const created = editing ? (editing.created||new Date().toISOString()) : new Date().toISOString();

  for(const [k,p] of Object.entries(draft.positions))
    rec.positions[k]={ grade:p.grade||null, particle:p.particle||"", comp:p.comp||"", oil:p.oil||"", defect:p.defect||"", cause:p.cause||"", comment:p.comment||"", photos:(p.photos||[]).slice(), video:p.video||null };
  await dbPut(rec); resetForm(); renderPending();
  const m=t("m_saved"); dlg([m[0], m[1].replace("{x}",equip)]);
};

/* ===================== pending ===================== */
async function renderPending(){
  const all=(await dbAll()).sort((a,b)=>b.created.localeCompare(a.created));
  $("qCount").textContent=all.length;
  if(!all.length){ $("pending").innerHTML=`<div class="empty">${t("empty_none")}</div>`; return; }
  $("pending").innerHTML="";
  for(const rec of all){
    const firstP=Object.values(rec.positions).find(p=>(p.photos&&p.photos.length)); const first=firstP?firstP.photos[0]:null;
    const nPhotos=Object.values(rec.positions).reduce((s,p)=>s+((p.photos&&p.photos.length)||0),0);
    const nVid=Object.values(rec.positions).filter(p=>p.video).length; const nPos=Object.keys(rec.positions).length;
    const row=document.createElement("div"); row.className="pitem";
    const thumb=first?`<img class="thumb" src="${URL.createObjectURL(first)}">`:`<div class="thumb"></div>`;
    const typeTag=`${rec.cls||""} ${rec.type||"MP"}`.trim();
    row.innerHTML=`${thumb}<div class="meta"><div class="a"><span class="tag">${typeTag}</span>${rec.equip} · ${rec.date}</div>
      <div class="b">${nPos} ${t("pos_count")} · ${nPhotos} ${t("photo_count")}${nVid?` · ${nVid}🎥`:""}${rec.smu?` · SMU ${rec.smu}`:""}</div></div>
      <button class="edit" title="Edit">✎</button><button class="del" title="Delete">🗑</button>`;
    const openEdit=()=>editRecord(rec);
    row.querySelector(".edit").onclick=(ev)=>{ev.stopPropagation();openEdit();};
    row.querySelector(".meta").onclick=openEdit; row.querySelector(".thumb").onclick=openEdit;
    row.querySelector(".del").onclick=async (ev)=>{ ev.stopPropagation(); await dbDel(rec.id); if(editing&&editing.id===rec.id) setEditing(null); renderPending(); };
    $("pending").appendChild(row);
  }
}

/* ===================== naming + export ===================== */
function ddmmyyyy(iso){ const m=String(iso).match(/(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}.${m[2]}.${m[1]}`:iso; }
function fileName(equip,item,date,ext,suffix){ return `${equip}_${String(item).replace(/\./g,"-")}_${ddmmyyyy(date)}_${suffix}.${ext}`; }
function extOf(blob){ const t=(blob.type||"").toLowerCase(); if(t.includes("png"))return"png"; if(t.includes("webp"))return"webp"; return "jpg"; }
async function buildPackage(){
  const all=await dbAll(); const files=[]; const grades={}, notes={};
  for(const rec of all){ const suffix=(TYPE_META[rec.type]&&TYPE_META[rec.type].suffix)||rec.type||"MP";
    if(rec.smu) (notes[`${rec.equip}|${rec.date}`] ||= {}).smu=rec.smu;
    for(const [k,p] of Object.entries(rec.positions)){
      const ph=p.photos||(p.photoBlob?[p.photoBlob]:[]);
      for(let i=0;i<ph.length;i++){ const ext=extOf(ph[i]); const base=fileName(rec.equip,k,rec.date,ext,suffix);
        const name = ph.length>1 ? base.replace("."+ext, "_"+(i+1)+"."+ext) : base;
        files.push({name, data:new Uint8Array(await ph[i].arrayBuffer())}); }
      if(p.video){ const vext=(p.video.type||"").includes("quicktime")?"mov":"mp4";
        files.push({name:fileName(rec.equip,k,rec.date,vext,suffix), data:new Uint8Array(await p.video.arrayBuffer())}); }
      if(p.grade) grades[`${rec.equip}|${rec.date}|${k}`]=p.grade;
      const nk=`${rec.equip}|${rec.date}|${k}`; const n={};
      if(p.particle)n.particleCount=p.particle; if(p.comp)n.componentHours=p.comp; if(p.oil)n.oilHours=p.oil;
      if(p.defect)n.defect=defectLabel(p.defect,"en"); if(p.cause)n.cause=causeLabel(p.cause,"en"); if(p.comment)n.comment=p.comment;
      if(Object.keys(n).length) notes[nk]={...(notes[nk]||{}),...n};
    } }
  files.push({name:"entries.json", data:new TextEncoder().encode(JSON.stringify({type:"cm-magplug-entries",version:1,grades,notes},null,2))});
  return {files, count:all.length};
}
$("exportBtn").onclick=async ()=>{ const {files,count}=await buildPackage(); if(!count){ dlg(t("m_nothing_export")); return; }
  const url=URL.createObjectURL(new Blob([makeZip(files)],{type:"application/zip"}));
  const a=document.createElement("a"); a.href=url; a.download=`truck_inspection_${$("date").value||"export"}.zip`; a.click(); URL.revokeObjectURL(url); dlg(t("m_exported")); };
$("shareBtn").onclick=async ()=>{ const {files,count}=await buildPackage(); if(!count){ dlg(t("m_nothing_share")); return; }
  const zf=new File([makeZip(files)],`truck_inspection_${$("date").value||"export"}.zip`,{type:"application/zip"});
  if(navigator.canShare && navigator.canShare({files:[zf]})){ try{ await navigator.share({files:[zf],title:"Truck inspection"}); }catch(e){} } else dlg(t("m_share_na")); };

/* ===================== PDF condition-monitoring report ===================== */
const GRADE_HEX={A:"#0ca30c",B:"#fab219",C:"#ec835a",D:"#d03b3b",X:"#8b8a83"};
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function itemLabelFor(rec,k){
  if(rec.type==="INSP" && rec.equip && UNIT_TPL[rec.equip]!=null){ const it=flattenTree(COMP_TREE[UNIT_TPL[rec.equip]]).find(x=>x.k===k); if(it) return it[lang]||it.en; }
  const list=(CLASSES[rec.cls]&&CLASSES[rec.cls][rec.type])||[];
  for(const e of list){ if(typeof e==="string"){ if(e===k) return COMP[e]?(COMP[e][lang]||COMP[e].en):k; } else if(e.k===k){ return e[lang]||e.en; } } return ""; }
async function blobToThumb(blob,max){ const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(blob);});
  const s=Math.min(1,max/Math.max(img.width,img.height)); const w=Math.round(img.width*s),h=Math.round(img.height*s);
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h); return c.toDataURL("image/jpeg",0.7); }
async function buildReportHTML(){
  const all=(await dbAll()).sort((a,b)=>a.equip.localeCompare(b.equip)||(a.date||"").localeCompare(b.date||"")); const L=t;
  let h=`<div style="font-family:system-ui,Arial,sans-serif;color:#111;width:760px;">`;
  h+=`<div style="border-bottom:3px solid #2a78d6;padding-bottom:10px;margin-bottom:16px;">
    <div style="font-size:22px;font-weight:800;">${esc(L("rep_title"))}</div>
    <div style="color:#555;font-size:12px;margin-top:4px;">${esc(L("rep_generated"))}: ${esc(new Date().toLocaleString())} · ${all.length}</div></div>`;
  for(const rec of all){
    const cls=CLASSES[rec.cls]?(CLASSES[rec.cls][lang]||CLASSES[rec.cls].en):(rec.cls||"");
    const pos=Object.entries(rec.positions); const cnt={A:0,B:0,C:0,D:0,X:0};
    pos.forEach(([k,p])=>{ if(p.grade&&cnt[p.grade]!=null)cnt[p.grade]++; });
    const att=pos.filter(([k,p])=>p.grade==="C"||p.grade==="D"||p.defect);
    h+=`<div style="margin-bottom:22px;page-break-inside:avoid;">
      <div style="background:#f2f2ef;border:1px solid #ddd;border-radius:8px;padding:10px 12px;">
        <span style="font-size:16px;font-weight:800;">${esc(rec.equip)}</span>
        <span style="color:#555;"> — ${esc(cls)} · ${esc(L("type_"+(rec.type||"MP")))} · ${esc(rec.date||"")}${rec.smu?` · SMU ${esc(rec.smu)}`:""}</span></div>
      <div style="margin:8px 0;font-size:12px;">${esc(L("rep_summary"))}: `;
    ["A","B","C","D","X"].forEach(g=>{ if(cnt[g]) h+=`<span style="display:inline-block;background:${GRADE_HEX[g]};color:#fff;border-radius:10px;padding:1px 8px;margin-right:5px;">${g}: ${cnt[g]}</span>`; });
    h+=`</div><div style="font-size:12px;margin-bottom:6px;"><b>${esc(L("rep_attention"))}:</b> `;
    h+= att.length? att.map(([k,p])=>`${esc(k)} (${esc(p.grade||"")}${p.defect?": "+esc(defectLabel(p.defect)):""})`).join("; ") : esc(L("rep_none_att"));
    h+=`</div><table style="width:100%;border-collapse:collapse;font-size:11px;"><tr style="background:#e9e9e4;">
      <th style="border:1px solid #ccc;padding:4px;text-align:left;">${esc(L("rep_item"))}</th>
      <th style="border:1px solid #ccc;padding:4px;">${esc(L("rep_grade"))}</th>
      <th style="border:1px solid #ccc;padding:4px;text-align:left;">${esc(L("rep_defect"))}</th>
      <th style="border:1px solid #ccc;padding:4px;text-align:left;">${esc(L("rep_cause"))}</th>
      <th style="border:1px solid #ccc;padding:4px;text-align:left;">${esc(L("rep_read"))}</th></tr>`;
    for(const [k,p] of pos){ const read=[p.particle&&`PC ${esc(p.particle)}`,p.comp&&`${esc(p.comp)}h comp`,p.oil&&`${esc(p.oil)}h oil`,p.comment&&esc(p.comment)].filter(Boolean).join(" · ");
      h+=`<tr><td style="border:1px solid #ccc;padding:4px;"><b>${esc(k)}</b> ${esc(itemLabelFor(rec,k))}</td>
        <td style="border:1px solid #ccc;padding:4px;text-align:center;">${p.grade?`<span style="background:${GRADE_HEX[p.grade]||"#888"};color:#fff;border-radius:8px;padding:1px 7px;">${esc(p.grade)}</span>`:""}</td>
        <td style="border:1px solid #ccc;padding:4px;">${p.defect?esc(defectLabel(p.defect)):""}</td>
        <td style="border:1px solid #ccc;padding:4px;">${p.cause?esc(causeLabel(p.cause)):""}</td>
        <td style="border:1px solid #ccc;padding:4px;">${read}</td></tr>`; }
    h+=`</table>`;
    for(const [k,p] of pos){ const ph=p.photos||(p.photoBlob?[p.photoBlob]:[]); if(!ph.length) continue;
      h+=`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px;">`;
      h+=`<span style="font-size:10.5px;color:#555;min-width:70px;"><b>${esc(k)}</b></span>`;
      for(const b of ph){ const u=await blobToThumb(b,260); h+=`<img src="${u}" style="width:104px;height:78px;object-fit:cover;border:1px solid #ccc;border-radius:4px;">`; }
      h+=`</div>`; }
    h+=`</div>`;
  }
  h+=`<div style="border-top:1px solid #ccc;margin-top:20px;padding-top:8px;color:#888;font-size:10px;">${esc(L("rep_by"))}</div></div>`;
  return h;
}
$("reportBtn").onclick=async ()=>{
  const all=await dbAll(); if(!all.length){ dlg(t("m_nothing_export")); return; }
  if(!(window.jspdf&&window.jspdf.jsPDF)||!window.html2canvas){ dlg(["PDF engine not ready","Open the app once online so it can load, then try again."]); return; }
  dlg(t("rep_building"));
  try{
    const holder=document.createElement("div"); holder.style.cssText="position:fixed;left:-9999px;top:0;width:760px;background:#fff;padding:24px;";
    holder.innerHTML=await buildReportHTML(); document.body.appendChild(holder);
    // Rasterize the whole report (renders Cyrillic, colours, photos exactly), then paginate onto A4.
    const canvas=await window.html2canvas(holder, {scale:1.6, useCORS:true, backgroundColor:"#ffffff"});
    holder.remove();
    const doc=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
    const PW=595, PH=842, M=18, cw=PW-2*M;
    const pageSrcH=Math.floor(canvas.width*(PH-2*M)/cw);   // source px per page
    let sY=0, first=true;
    while(sY<canvas.height){
      const sliceH=Math.min(pageSrcH, canvas.height-sY);
      const c2=document.createElement("canvas"); c2.width=canvas.width; c2.height=sliceH;
      c2.getContext("2d").drawImage(canvas,0,sY,canvas.width,sliceH,0,0,canvas.width,sliceH);
      if(!first) doc.addPage(); first=false;
      doc.addImage(c2.toDataURL("image/jpeg",0.85),"JPEG",M,M,cw,sliceH*(cw/canvas.width));
      sY+=sliceH;
    }
    $("dlg").close();
    doc.save(`CM_report_${todayISO()}.pdf`);
  }catch(err){ $("dlg").close(); dlg(["Report error", String(err&&err.message||err)]); }
};

/* ===================== minimal ZIP (store) ===================== */
function makeZip(files){ const enc=new TextEncoder(); const chunks=[],central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255]; const u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  for(const f of files){ const nameB=enc.encode(f.name); const data=f.data; const crc=crc32(data);
    const local=[].concat([0x50,0x4b,0x03,0x04],u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    chunks.push(new Uint8Array(local),nameB,data);
    const cen=[].concat([0x50,0x4b,0x01,0x02],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cen),nameB); offset+=local.length+nameB.length+data.length; }
  let censize=0; central.forEach(c=>censize+=c.length);
  const end=[].concat([0x50,0x4b,0x05,0x06],u16(0),u16(0),u16(files.length),u16(files.length),u32(censize),u32(offset),u16(0));
  const parts=[...chunks,...central,new Uint8Array(end)]; let total=0; parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total); let pos=0; parts.forEach(p=>{out.set(p,pos);pos+=p.length;}); return out; }
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }

/* ===================== QR scan ===================== */
const qrCanvas=$("qrCanvas"); const qctx=qrCanvas.getContext("2d",{willReadFrequently:true}); let scanStream=null, scanRAF=null;
function extractUnit(text){ if(!text) return null; const m=String(text).match(/([A-Za-z]{1,4}\s?\d+)/); return m?m[1].toUpperCase().replace(/\s+/g,""):String(text).trim().toUpperCase(); }
async function startScan(){ if(!window.jsQR){ dlg(t("m_scan_wait")); return; }
  try{ scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}}); }catch(e){ $("qrPhoto").click(); return; }
  const v=$("scanVideo"); v.srcObject=scanStream; await v.play(); $("scanOverlay").classList.remove("hidden");
  const tick=()=>{ if(v.readyState>=2){ qrCanvas.width=v.videoWidth; qrCanvas.height=v.videoHeight; qctx.drawImage(v,0,0,qrCanvas.width,qrCanvas.height);
      const img=qctx.getImageData(0,0,qrCanvas.width,qrCanvas.height); const code=window.jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
      if(code&&code.data){ const u=extractUnit(code.data); if(u){ selectEquip(u); stopScan(); return; } } }
    scanRAF=requestAnimationFrame(tick); }; scanRAF=requestAnimationFrame(tick); }
function stopScan(){ if(scanRAF)cancelAnimationFrame(scanRAF); scanRAF=null; if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } $("scanVideo").srcObject=null; $("scanOverlay").classList.add("hidden"); }
$("scanBtn").onclick=startScan; $("scanCancel").onclick=stopScan;
$("qrPhoto").onchange=async (e)=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(f); });
  qrCanvas.width=img.width; qrCanvas.height=img.height; qctx.drawImage(img,0,0);
  const id=qctx.getImageData(0,0,img.width,img.height); const code=window.jsQR && window.jsQR(id.data,id.width,id.height);
  if(code&&code.data){ selectEquip(extractUnit(code.data)); } else dlg(t("m_no_qr")); };

/* ===================== dictation ===================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){ let rec=null, listening=false;
  $("micBtn").onclick=()=>{ if(listening){ rec&&rec.stop(); return; }
    rec=new SR(); rec.lang=lang==="ru"?"ru-RU":"en-US"; rec.interimResults=false; rec.continuous=false;
    rec.onresult=(e)=>{ const tr=e.results[0][0].transcript; const ta=$("comment"); ta.value=(ta.value?ta.value+" ":"")+tr; ta.dispatchEvent(new Event("input")); };
    rec.onend=()=>{ listening=false; $("micBtn").classList.remove("rec"); }; rec.onerror=()=>{ listening=false; $("micBtn").classList.remove("rec"); };
    listening=true; $("micBtn").classList.add("rec"); rec.start(); };
} else { $("micBtn").onclick=()=>dlg(t("m_dictation")); }

/* ===================== language ===================== */
function applyLang(){ document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  fillClassSel(); fillTypeSel();
  $("secPosTitle").textContent=TYPE_META[type].title[lang]||TYPE_META[type].title.en;
  $("posLabel").textContent=`${curItem} — ${itemLabel(curItem)}`;
  updateDefectCauseBtns(); renderMedia();
  updateSaveLabel(); if(editing) $("editBannerText").textContent=t("editing_hint").replace("{x}",editing.equip); $("cancelEdit").textContent=t("btn_cancel");
  setNet(); renderPending();
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang)); }
document.querySelector(".lang").addEventListener("click",(e)=>{ const b=e.target.closest("button[data-lang]"); if(!b) return; lang=b.dataset.lang; localStorage.setItem("lang",lang); applyLang(); });

/* ===================== connectivity + SW ===================== */
function setNet(){ const on=navigator.onLine; $("netStatus").textContent=on?t("net_online"):t("net_offline"); $("netStatus").className="st "+(on?"on":"off"); }
addEventListener("online",setNet); addEventListener("offline",setNet);
if("serviceWorker" in navigator && location.protocol==="https:"){ let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded)return; reloaded=true; location.reload(); });
  navigator.serviceWorker.register("sw.js").then(reg=>{ reg.update&&reg.update(); }).catch(()=>{}); }

/* ===================== force-update (clears cache + service worker) ===================== */
const fu=$("forceUpdate"); if(fu) fu.onclick=async (e)=>{ e.preventDefault();
  try{ if("serviceWorker" in navigator){ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); } }catch(_){}
  try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(_){}
  location.reload(true); };

/* ===================== init ===================== */
updateEquipBtn();
applyForm(); applyLang();
</script>
